<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- أساسيات الصفحة -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Yossef Portfolio" />

    <title>Yossef Ibrahim Portfolio</title>

    <!-- وصف SEO -->
    <meta
      name="description"
      content="Yossef Ibrahim - Web Developer Portfolio. Showcasing projects, skills, and interactive web apps built with React and Vite."
    />
    <meta
      name="keywords"
      content="Yossef Ibrahim, React, Vite, Portfolio, Web Development, Projects, Frontend Developer"
    />
    <meta name="author" content="Yossef Ibrahim" />
    <meta name="image" content="/social-preview.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="Yossef Ibrahim Portfolio" />
    <meta
      property="og:description"
      content="Showcasing Yossef Ibrahim's web development projects and portfolio built with React and Vite."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://username.github.io/Yossef_Portfolio/"
    />
    <meta property="og:image" content="/social-preview.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yossef Ibrahim Portfolio" />
    <meta
      name="twitter:description"
      content="Explore Yossef Ibrahim's web development portfolio and interactive React projects."
    />
    <meta name="twitter:image" content="/social-preview.png" />

    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS (لو عندك CSS خارجي) -->
    <!-- <link rel="stylesheet" href="/src/index.css" /> -->

    <!-- Performance: Inline critical CSS -->
    <style>
      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      #root {
        width: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="font-roboto bg-background text-foreground">
    <div id="root"></div>

    <!-- Main React entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
